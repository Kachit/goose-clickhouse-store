version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - dupl
    - errcheck
    - funlen
    - goconst
    - gocognit
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - nlreturn
    - prealloc
    - staticcheck
    - unconvert
    - unused
  settings:
    funlen:
      lines: 70
      statements: 50
  exclusions:
    rules:
      - path: '(.+)_test\.go'
        linters:
          - dupl
          - funlen
          - lll
    paths:
      - example
      - tmp

formatters:
  enable:
    - gofmt
